<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DAX GPT · Demo (Diag paso a paso)</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{height:100%;margin:0;background:#f6f7fb}
    .wrap{max-width:1040px;margin:24px auto;background:#fff;border:1px solid #e5e7eb;
      border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;
      font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e5e7eb;background:#fff}
    .dot{width:10px;height:10px;border-radius:50%;background:#EF4C1D;box-shadow:0 0 0 4px rgba(239,76,29,.12)}
    .title{font-weight:700}.sub{color:#6b7280;font-size:12px}
    .body{height:78vh}
    .body openai-chatkit{display:block;width:100%;height:100%}
    .log{padding:16px;border-top:1px dashed #e5e7eb;background:#fff;font:500 14px/1.55 Inter,system-ui}
    .log div{margin:.2rem 0}
    .bad{color:#b91c1c}.ok{color:#166534}.muted{color:#6b7280}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr"><span class="dot"></span><div><div class="title">DAX GPT · Demo</div><div class="sub">(Versión Beta 0.1.0: Baby IA)</div></div></div>
    <div class="body"><div id="mount"></div></div>
    <div class="log" id="log"></div>
  </div>

  <script type="module">
    const logBox = document.getElementById('log');
    const mount  = document.getElementById('mount');
    const SESSION_ENDPOINT = '/api/create-session'; // mismo origen

    const log = (msg, cls='') => logBox.insertAdjacentHTML('beforeend', `<div class="${cls}">${msg}</div>`);

    (async function main(){
      try{
        log('1) Iniciando script…', 'muted');

        // 1) Cargar el web-component
        try{
          await import('https://cdn.jsdelivr.net/npm/@openai/chatkit/dist/web.js');
          log('2) Web component cargado ✅', 'ok');
        }catch(e){
          log('2) Error cargando web component ❌ → '+String(e), 'bad'); return;
        }

        // 2) Llamar a create-session
        let data;
        try{
          log('3) Pidiendo client_secret a '+SESSION_ENDPOINT+' …', 'muted');
          const r = await fetch(SESSION_ENDPOINT, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:'{}'
          });
          const raw = await r.text();
          log(`3.1) Respuesta HTTP: ${r.status}`, r.ok ? 'ok' : 'bad');
          if(!r.ok){ log('<code>'+raw.replace(/</g,'&lt;')+'</code>', 'bad'); return; }
          data = JSON.parse(raw);
          if(!data.client_secret){
            log('3.2) JSON sin client_secret ❌ → <code>'+raw.replace(/</g,'&lt;')+'</code>', 'bad'); return;
          }
          log('3.2) client_secret recibido ✅', 'ok');
        }catch(e){
          log('3) Excepción en fetch ❌ → '+String(e), 'bad'); return;
        }

        // 3) Montar el chat
        try{
          const el = document.createElement('openai-chatkit');
          el.setOptions({
            api:{ async getClientSecret(){ return data.client_secret } },
            theme:{ colorScheme:"light",
                    color:{ accent:{ primary:"#EF4C1D" } },
                    radius:"round",
                    typography:{ fontFamily:"Inter, system-ui, sans-serif" } },
            startScreen:{ greeting:"👋 Hola, soy DAX GPT. Demo embebida en Vercel." }
          });
          mount.innerHTML = '';
          mount.appendChild(el);
          log('4) Componente añadido al DOM ✅', 'ok');

          setTimeout(()=>{
            const h = el.getBoundingClientRect().height|0;
            if(h<50){ log('4.1) El componente no renderizó UI (altura '+h+'px). Revisa consola por errores.', 'bad'); }
            else { log('4.1) UI renderizada (altura '+h+'px) ✅', 'ok'); }
          }, 2000);
        }catch(e){
          log('4) Excepción montando componente ❌ → '+String(e), 'bad'); return;
        }
      }catch(e){
        log('∑ Error inesperado: '+String(e), 'bad');
      }
    })();
  </script>
</body>
</html>
