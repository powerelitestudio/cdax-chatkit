<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DAX GPT · Demo (Diag)</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{height:100%;margin:0;background:#f6f7fb}
    .wrap{max-width:1040px;margin:24px auto;background:#fff;border:1px solid #e5e7eb;
      border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;
      font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e5e7eb;background:#fff}
    .dot{width:10px;height:10px;border-radius:50%;background:#EF4C1D;box-shadow:0 0 0 4px rgba(239,76,29,.12)}
    .title{font-weight:700}.sub{color:#6b7280;font-size:12px}
    .body{height:78vh}
    .body openai-chatkit{display:block;width:100%;height:100%}
    .dbg{padding:16px;font:500 14px/1.55 Inter,system-ui}
    .dbg code{background:#f6f8fa;padding:2px 6px;border-radius:6px}
    .bad{color:#b91c1c}.ok{color:#166534}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr"><span class="dot"></span><div><div class="title">DAX GPT · Demo</div><div class="sub">(Versión Beta 0.1.0: Baby IA)</div></div></div>
    <div class="body"><div id="mount"></div></div>
  </div>

  <script type="module">
    const mount = document.getElementById('mount');
    const SESSION_ENDPOINT = '/api/create-session'; // mismo origen

    function show(html){
      mount.innerHTML = `<div class="dbg"><p class="bad"><strong>No pude iniciar DAX GPT.</strong></p>${html}</div>`;
    }

    // 1) Carga del web-component
    try{
      await import('https://cdn.jsdelivr.net/npm/@openai/chatkit/dist/web.js');
    }catch(e){
      show(`<p>Error cargando el web-component:</p><p><code>${String(e)}</code></p>`);
      throw e;
    }

    // 2) Llama a create-session y muestra exactamente qué devuelve
    let clientSecret;
    try{
      const r = await fetch(SESSION_ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:'{}'
      });
      const raw = await r.text();
      if(!r.ok){
        show(`<p>Fallo en <code>POST ${SESSION_ENDPOINT}</code>: <code>${r.status}</code></p>
              <p><code>${raw.replace(/</g,'&lt;')}</code></p>`);
        throw new Error('create-session failed');
      }
      const data = JSON.parse(raw);
      clientSecret = data.client_secret;
      if(!clientSecret){
        show(`<p>Respuesta sin <code>client_secret</code>.</p><p>JSON:</p><code>${raw.replace(/</g,'&lt;')}</code>`);
        throw new Error('missing client_secret');
      }
    }catch(e){
      console.error(e);
      throw e;
    }

    // 3) Monta el chat
    try{
      const el = document.createElement('openai-chatkit');
      el.setOptions({
        api:{ async getClientSecret(){ return clientSecret } },
        theme:{ colorScheme:"light", color:{ accent:{ primary:"#EF4C1D" } },
                radius:"round", typography:{ fontFamily:"Inter, system-ui, sans-serif" } },
        startScreen:{ greeting:"👋 Hola, soy DAX GPT. Demo embebida en Vercel." }
      });
      mount.innerHTML = ""; mount.appendChild(el);

      // Watchdog: si no se pinta nada en 8s, muestra ayuda
      setTimeout(()=>{
        if(el.getBoundingClientRect().height < 50){
          show(`<p>El componente no logró renderizar UI (altura baja).</p>
                <p>Abre la consola (F12) y mira errores de red o CSP.</p>`);
        }
      }, 8000);
    }catch(e){
      show(`<p>Excepción montando <code>&lt;openai-chatkit&gt;</code>:</p><p><code>${String(e)}</code></p>`);
      throw e;
    }
  </script>
</body>
</html>
