<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DAX GPT · Demo</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{height:100%;margin:0;background:#f6f7fb}
    .wrap{max-width:1040px;margin:24px auto;background:#fff;border:1px solid #e5e7eb;
      border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;
      font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e5e7eb;background:#fff}
    .dot{width:10px;height:10px;border-radius:50%;background:#EF4C1D;box-shadow:0 0 0 4px rgba(239,76,29,.12)}
    .title{font-weight:700}.sub{color:#6b7280;font-size:12px}
    .body{height:78vh}
    .body openai-chatkit{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr"><span class="dot"></span><div><div class="title">DAX GPT · Demo</div><div class="sub">(Versión Beta 0.1.0: Baby IA)</div></div></div>
    <div class="body"><div id="mount"></div></div>
  </div>

  <script type="module">
    // Misma origin: podemos usar ruta relativa sin CORS ni plugins de WP
    const SESSION_ENDPOINT = '/api/create-session';

    // Carga el web component
    await import('https://cdn.jsdelivr.net/npm/@openai/chatkit/dist/web.js');

    // Crea el componente y pide el client_secret al backend
    const el = document.createElement('openai-chatkit');
    el.setOptions({
      api: {
        async getClientSecret() {
          const r = await fetch(SESSION_ENDPOINT, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:'{}'
          });
          const data = await r.json();
          return data.client_secret; // ek_...
        }
      },
      theme: {
        colorScheme:"light",
        color:{ accent:{ primary:"#EF4C1D" } },
        radius:"round",
        typography:{ fontFamily:"Inter, system-ui, sans-serif" }
      },
      startScreen:{ greeting:"👋 Hola, soy DAX GPT. Esta es la demo embebida en Vercel." }
    });

    document.getElementById('mount').appendChild(el);
  </script>
</body>
</html>
