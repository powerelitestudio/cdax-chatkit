<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DAX GPT · Demo</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{height:100%;margin:0;background:#f6f7fb}
    .wrap{max-width:1040px;margin:24px auto;background:#fff;border:1px solid #e5e7eb;
      border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;
      font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e5e7eb;background:#fff}
    .dot{width:10px;height:10px;border-radius:50%;background:#EF4C1D;box-shadow:0 0 0 4px rgba(239,76,29,.12)}
    .title{font-weight:700}.sub{color:#6b7280;font-size:12px}
    .body{height:auto}
    /* 👇 clave: el host y el mount con altura real */
    #mount{height:78vh; min-height:520px}
    #mount openai-chatkit{display:block; width:100%; height:100%}
    .log{padding:16px;border-top:1px dashed #e5e7eb;background:#fff;font:500 14px/1.55 Inter,system-ui}
    .log div{margin:.2rem 0}
    .bad{color:#b91c1c}.ok{color:#166534}.muted{color:#6b7280}
  </style>
</head>
<body>
  <div class="wrap" id="cdax-demo" data-endpoint="/api/create-session">
    <div class="hdr"><span class="dot"></span>
      <div><div class="title">DAX GPT · Demo</div><div class="sub">(Versión Beta 0.1.0: Baby IA)</div></div>
    </div>
    <div class="body">
      <!-- 👇 altura explícita evita el 0px -->
      <div id="mount"></div>
    </div>
    <div class="log" id="log"><div class="muted">Cargando script…</div></div>
  </div>

  <script type="module" src="/demo.js" id="cdax-demo-js"></script>
  <noscript><div style="padding:1rem;font:500 14px/1.55 Inter">Activa JavaScript.</div></noscript>
</body>
</html>
